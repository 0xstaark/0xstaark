<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">0xstaark</title>
  <desc id="desc">Offensive security, penetration testing and tooling</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#eef1f4" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="16"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
    .cursor{animation:blink 1.1s steps(1) infinite}
    .halo{animation:pulse 2.6s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{50%{opacity:.04}}
    @media (prefers-reduced-motion:reduce){.flow,.cursor,.halo{animation:none}}
  </style>

  <rect x="1" y="1" width="1198" height="298" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#grid)" mask="url(#gridMask)"/>
  </g>

  <!-- intro text -->
  <text class="mono" x="72" y="98" font-size="24" fill="#59636e"><tspan fill="#1a7f37">$</tspan> whoami</text>
  <text class="mono" x="72" y="176" font-size="72" font-weight="700" fill="#1f2328" textLength="346" lengthAdjust="spacingAndGlyphs">0xstaark</text>
  <rect class="cursor" x="430" y="124" width="30" height="56" fill="#1a7f37"/>
  <text class="mono" x="72" y="230" font-size="20" fill="#59636e">Offensive security · Penetration testing · Tooling</text>

  <!-- attack-path graph -->
  <g stroke="#d0d7de" stroke-width="2">
    <line x1="830" y1="210" x2="895" y2="115"/>
    <line x1="830" y1="210" x2="960" y2="225"/>
    <line x1="895" y1="115" x2="1005" y2="145"/>
    <line x1="960" y1="225" x2="1005" y2="145"/>
    <line x1="895" y1="115" x2="1075" y2="72"/>
    <line x1="1005" y1="145" x2="1075" y2="72"/>
    <line x1="1005" y1="145" x2="1090" y2="210"/>
    <line x1="960" y1="225" x2="1090" y2="210"/>
    <line x1="1090" y1="210" x2="1135" y2="135"/>
    <line x1="1075" y1="72" x2="1135" y2="135"/>
  </g>
  <polyline points="830,210 895,115 1005,145 1090,210 1135,135" fill="none" stroke="#1a7f37" stroke-opacity="0.3" stroke-width="3" stroke-linejoin="round"/>
  <polyline class="flow" points="830,210 895,115 1005,145 1090,210 1135,135" fill="none" stroke="#1a7f37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#afb8c1" stroke-width="2">
    <circle cx="960" cy="225" r="7"/>
    <circle cx="1075" cy="72" r="7"/>
  </g>
  <g fill="#ffffff" stroke="#1a7f37" stroke-width="2.5">
    <circle cx="895" cy="115" r="7"/>
    <circle cx="1005" cy="145" r="7"/>
    <circle cx="1090" cy="210" r="7"/>
  </g>
  <circle cx="830" cy="210" r="7" fill="#1a7f37"/>
  <circle class="halo" cx="1135" cy="135" r="22" fill="#1a7f37" opacity="0.14"/>
  <circle cx="1135" cy="135" r="11" fill="#ffffff" stroke="#1a7f37" stroke-width="2.5"/>
  <circle cx="1135" cy="135" r="4.5" fill="#1a7f37"/>
</svg>
